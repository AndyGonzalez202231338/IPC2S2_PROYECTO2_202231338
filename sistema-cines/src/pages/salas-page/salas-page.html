<app-header-admin-cine></app-header-admin-cine>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0">Gestión de Salas</h2>
    <a routerLink="/create-sala-page" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i>
      Crear Nueva Sala
    </a>
  </div>

  <div class="row">
    @for (sala of salas; track sala.idSala) {
      <div class="col-12 col-md-6 col-lg-4 mb-4">
        <app-sala-card-component
          [selectedSala]="sala"
          (salaActualizada)="onSalaActualizada()">
        </app-sala-card-component>
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info text-center">
          <i class="bi bi-info-circle"></i>
          No hay Salas registradas en el Cine.
        </div>
      </div>
    }
  </div>
</div>

<app-footer></app-footer>
